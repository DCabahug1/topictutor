<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: {{z.minH}}; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Newsreader', Georgia, serif; box-sizing: border-box; padding: 0 {{z.gutter}} {{z.bottom}}; overflow: hidden; display: flex; flex-direction: column">
  <div style="width: 100%; max-width: 1200px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: {{z.headPad}}">
      <a href="#" style="font-size: {{z.brand}}; font-weight: 600; letter-spacing: -0.015em; color: {{t.ink}}; text-decoration: none">TopicTutor</a>
      <nav aria-label="Main" style="display: flex; align-items: center; gap: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 14px"><a href="#" style="padding: 12px 10px; color: {{t.ink}}; text-decoration: none">Log in</a><sc-if value="{{desk}}" hint-placeholder-val="{{ true }}"><a href="#" style="padding: 10px 14px; border: 1.5px solid {{t.ink}}; color: {{t.ink}}; text-decoration: none">Register</a></sc-if><button type="button" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: {{t.ink}}"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if><sc-if value="{{dark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if></button></nav>
    </header>
    <div style="border-top: 3px solid {{t.ink}}; border-bottom: 1px solid {{t.ink}}; height: 3px"></div>

    <main style="width: 100%; max-width: 480px; margin: {{z.leadTop}} auto 0">
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{v.ebInk}}; ">{{v.eb}}</p>
      <h1 style="margin: 18px 0 0; font-size: {{z.authH}}; line-height: 1; font-weight: 500; letter-spacing: -0.025em">{{v.h}}</h1>
      <sc-if value="{{v.line}}" hint-placeholder-val="{{ true }}"><p style="margin: 18px 0 0; font-size: 19px; line-height: 1.5; color: {{t.soft}}">{{v.line}}</p></sc-if>
      <sc-if value="{{v.banner}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 24px 0 0; padding: 14px 16px; background: {{t.incorrectWash}}; border-left: 4px solid {{t.incorrect}}; font-size: 17px; line-height: 1.45">{{v.banner}}</p></sc-if>
      <sc-if value="{{v.google}}" hint-placeholder-val="{{ true }}">
        <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 36px; min-height: 56px; border: 1.5px solid {{t.ink}}; color: {{t.ink}}; font-family: 'IBM Plex Mono', monospace; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"></path><path fill="currentColor" opacity=".75" d="M12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"></path><path fill="currentColor" opacity=".55" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9z"></path><path fill="currentColor" opacity=".9" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.8 9.4 6 12 6z"></path></svg>Continue with Google</a>
        <p aria-hidden="true" style="display: flex; align-items: center; gap: 14px; margin: 24px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}}"><span style="flex: 1; height: 1px; background: {{t.rule}}"></span>or with email<span style="flex: 1; height: 1px; background: {{t.rule}}"></span></p>
      </sc-if>
      <sc-for list="{{v.fields}}" as="f" hint-placeholder-count="2">
        <label style="display: block; margin-top: 22px">
          <span style="display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}}"><span>{{f.label}}</span><sc-if value="{{f.forgot}}" hint-placeholder-val="{{ false }}"><a href="#" style="font-size: 13px; letter-spacing: 0; text-transform: none; color: {{t.soft}}; text-underline-offset: 4px">Forgot password?</a></sc-if></span>
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; min-height: 56px; padding: 0 16px; box-sizing: border-box; background: {{t.raised}}; border: {{f.bw}} solid {{f.border}}; font-size: 19px"><span style="color: {{f.ink}}; letter-spacing: {{f.ls}}">{{f.value}}</span><sc-if value="{{f.secret}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{t.soft}}">Show</span></sc-if></span>
          <sc-if value="{{f.help}}" hint-placeholder-val="{{ false }}"><span style="display: block; margin-top: 8px; font-size: 16px; color: {{f.helpInk}}">{{f.help}}</span></sc-if>
        </label>
      </sc-for>
      <div style="margin-top: 32px"><a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 14px; width: 100%; box-sizing: border-box; min-height: 58px; padding: 0 30px; background: {{t.ink}}; color: {{t.bg}}; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; text-decoration: none; ">{{v.cta}}<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></div>
      <sc-if value="{{v.alt}}" hint-placeholder-val="{{ true }}"><p style="margin: 20px 0 0; font-size: 17px; color: {{t.muted}}">{{v.altPre}} <a href="#" style="font-style: italic; color: {{t.soft}}; text-underline-offset: 5px">{{v.alt}}</a></p></sc-if>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["login","loginError","register","registerError","checkEmail","resetRequest","resetSent","resetNew","resetDone","linkExpired"],"default":"login"},"dark":{"editor":"boolean","default":false},"tone":{"editor":"enum","options":["graphite","slate","umber","black"],"default":"graphite"},"phone":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {

    const dark = this.props.dark ?? false;
    const tone = this.props.tone ?? 'graphite';
    const phone = this.props.phone ?? false;
    const DARK = {
      black: { bg: '#121416', ink: '#E9EAE6', soft: '#C9CCC8', muted: '#A3A8AD', rule: '#3A3F44', accent: '#FF7A50', raised: '#1A1D20', sunk: '#24282C', correct: '#8DB4F0', correctWash: '#1A2638', incorrect: '#F0A35E', incorrectWash: '#2E2216' },
      graphite: { bg: '#1E2124', ink: '#E6E7E3', soft: '#C4C7C3', muted: '#A0A5AA', rule: '#3E444A', accent: '#FF7A50', raised: '#272B2F', sunk: '#31363B', correct: '#8DB4F0', correctWash: '#24324A', incorrect: '#F0A35E', incorrectWash: '#3A2C1E' },
      slate: { bg: '#1D2330', ink: '#E4E7EC', soft: '#C3C8D1', muted: '#9DA6B4', rule: '#3B4558', accent: '#FF8159', raised: '#262E3D', sunk: '#303A4C', correct: '#93B8F2', correctWash: '#26344D', incorrect: '#F2A866', incorrectWash: '#3B2E22' },
      umber: { bg: '#24221F', ink: '#ECE8E1', soft: '#CBC5BB', muted: '#A9A397', rule: '#46423B', accent: '#FF7E54', raised: '#2D2A26', sunk: '#38352F', correct: '#93B6EE', correctWash: '#2B3446', incorrect: '#F2A866', incorrectWash: '#3E3022' }
    };
    const t = dark ? (DARK[tone] || DARK.graphite)
      : { bg: '#F1F2EE', ink: '#16181A', soft: '#3B3F43', muted: '#565B60', rule: '#C9CCC6', accent: '#C23A12', raised: '#FFFFFF', sunk: '#E2E4DE', correct: '#1F4E8C', correctWash: '#E3EAF4', incorrect: '#8F3F00', incorrectWash: '#F6E7D8' };
    const Z = phone
      ? { minH: '1000px', gutter: '24px', bottom: '0', headPad: '8px 0 10px', brand: '24px', leadTop: '56px', h1: '46px', h1Sm: '38px', h2: '28px', lead: '19px', body: '18px', gap: '88px', btnW: '100%', actDir: 'column', actAlign: 'stretch', actTop: '32px', rowTitle: '21px', big: '96px' }
      : { minH: '900px', gutter: '72px', bottom: '96px', headPad: '20px 0 16px', brand: '28px', leadTop: '112px', h1: '84px', h1Sm: '64px', h2: '36px', lead: '23px', body: '20px', gap: '152px', btnW: 'auto', actDir: 'row', actAlign: 'center', actTop: '40px', rowTitle: '25px', big: '160px' };
    const base = { t, dark, isLight: !dark, phone, desk: !phone, themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme' };

    const variant = this.props.variant ?? 'login';
    const z = Object.assign({}, Z, phone ? { authH: '40px', leadTop: '48px' } : { authH: '56px', leadTop: '96px' });
    const f = (label, value, o) => Object.assign({ label, value, secret: false, forgot: false, help: '', helpInk: t.muted, bw: '1.5px', border: t.ink, ink: t.ink, ls: 'normal' }, o || {});
    const pw = (label, o) => f(label, '••••••••••', Object.assign({ secret: true, ls: '0.1em' }, o || {}));
    const err = (msg) => ({ help: '✕ ' + msg, helpInk: t.incorrect, bw: '2px', border: t.incorrect });
    const email = f('Email', 'duane@example.com');
    const V = {
      login: { eb: 'Welcome back', h: 'Log in', google: true, fields: [email, pw('Password', { forgot: true })], cta: 'Log in', altPre: 'New here?', alt: 'Create an account' },
      loginError: { eb: 'Welcome back', h: 'Log in', banner: 'The email and password don’t match. Your progress is safe.', google: true, fields: [email, pw('Password', Object.assign({ forgot: true }, err('That password doesn’t match this email. Check it, or reset it.')))], cta: 'Log in', altPre: 'New here?', alt: 'Create an account' },
      register: { eb: 'Free · no credit card', h: 'Create your account', line: 'Started as a guest? Your streak and lessons come with you.', google: true, fields: [f('Name', 'Duane Cabahug', { help: 'Up to 25 characters.' }), email, pw('Password', { help: 'At least 8 characters.' })], cta: 'Create account', altPre: 'Already have one?', alt: 'Log in' },
      registerError: { eb: 'Free · no credit card', h: 'Create your account', google: true, fields: [f('Name', 'Duane Cabahug'), f('Email', 'duane@example', err('This email is missing its ending, like .com.')), pw('Password'), pw('Confirm password', err('These two passwords don’t match.'))], cta: 'Create account', altPre: 'Already have one?', alt: 'Log in' },
      checkEmail: { eb: 'One more step', h: 'Check your email.', line: 'We sent a confirmation link to duane@example.com. Open it on this device and you’re in. It can take a minute.', fields: [], cta: 'Open your email app', altPre: 'Nothing yet?', alt: 'Send it again' },
      resetRequest: { eb: 'Password reset', h: 'Forgot your password?', line: 'Enter your email and we’ll send a link to set a new one.', fields: [email], cta: 'Send reset link', altPre: 'Remembered it?', alt: 'Log in' },
      resetSent: { eb: 'Password reset', h: 'Check your email.', line: 'If an account uses duane@example.com, a reset link is on its way. It works for one hour.', fields: [], cta: 'Back to log in', altPre: 'Wrong address?', alt: 'Try another email' },
      resetNew: { eb: 'Password reset', h: 'Set a new password', line: 'For duane@example.com.', fields: [pw('New password', { help: 'At least 8 characters.' }), pw('Confirm new password')], cta: 'Save new password', altPre: 'Changed your mind?', alt: 'Log in' },
      resetDone: { eb: '✓ Password changed', ebInk: t.correct, h: 'You’re all set.', line: 'Your new password works now. You’ve been signed out on other devices.', fields: [], cta: 'Log in' },
      linkExpired: { eb: '✕ Link expired', ebInk: t.incorrect, h: 'That link has stopped working.', line: 'Links in our emails work once, for one hour. Nothing about your account changed.', fields: [], cta: 'Send a new link', altPre: 'Or', alt: 'go to log in' }
    }[variant];
    const v = Object.assign({ ebInk: t.accent, line: '', banner: '', google: false, alt: '', altPre: '' }, V);
    return Object.assign(base, { z, v });
  }
}
</script>
</body>
</html>
