<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subject picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: {{z.minH}}; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Newsreader', Georgia, serif; box-sizing: border-box; padding: 0 {{z.gutter}} {{z.bottom}}; overflow: hidden; display: flex; flex-direction: column">
  <div style="width: 100%; max-width: 1200px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: {{z.headPad}}">
      <a href="#" style="font-size: {{z.brand}}; font-weight: 600; letter-spacing: -0.015em; color: {{t.ink}}; text-decoration: none">TopicTutor</a>
      <nav aria-label="Main" style="display: flex; align-items: center; gap: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 14px"><a href="#" style="padding: 12px 10px; color: {{t.ink}}; text-decoration: none">Log in</a><sc-if value="{{desk}}" hint-placeholder-val="{{ true }}"><a href="#" style="padding: 10px 14px; border: 1.5px solid {{t.ink}}; color: {{t.ink}}; text-decoration: none">Register</a></sc-if><button type="button" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: {{t.ink}}"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if><sc-if value="{{dark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if></button></nav>
    </header>
    <div style="border-top: 3px solid {{t.ink}}; border-bottom: 1px solid {{t.ink}}; height: 3px"></div>

    <main style="margin-top: {{z.leadTop}}">
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.accent}}; ">Lesson finished · day 1</p>
      <h1 style="margin: 18px 0 0; max-width: 820px; font-size: {{z.h1Sm}}; line-height: 1; font-weight: 500; letter-spacing: -0.025em">What should tomorrow be about?</h1>
      <p style="margin: 22px 0 0; max-width: 520px; font-size: {{z.lead}}; line-height: 1.45; color: {{t.soft}}">Pick as many as you like. Your daily lesson rotates through them.</p>
      <div role="group" aria-label="Subjects" style="display: grid; grid-template-columns: {{z.cols}}; margin-top: 48px; border-top: 1px solid {{t.ink}}; border-left: 1px solid {{t.ink}}">
        <sc-for list="{{tiles}}" as="s" hint-placeholder-count="11">
          <button type="button" aria-pressed="{{s.on}}" onClick="{{s.go}}" style="position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 14px; min-height: {{z.tileH}}; padding: 16px 18px; text-align: left; background: {{s.bg}}; color: {{s.ink}}; border: none; border-right: 1px solid {{t.ink}}; border-bottom: 1px solid {{t.ink}}; font-family: 'Newsreader', Georgia, serif; cursor: pointer; transition: background 200ms, color 200ms">
            <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 4px; background: {{s.bar}}"></span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: {{s.mark}}">{{s.glyph}}</span>
            <span style="font-size: {{z.tileName}}; line-height: 1.05; font-weight: 500; letter-spacing: -0.015em">{{s.name}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px 40px; margin-top: 32px">
        <p aria-live="polite" style="margin: 0; font-size: 19px; font-style: italic; color: {{t.soft}}">{{status}}</p>
        <div style="display: flex; flex-direction: {{z.actDir}}; align-items: {{z.actAlign}}; gap: 14px 28px; margin-top: 0"><a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 14px; width: {{z.btnW}}; box-sizing: border-box; min-height: 58px; padding: 0 30px; background: {{t.ink}}; color: {{t.bg}}; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; text-decoration: none; ">Save subjects<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a><a href="#" style="display: inline-block; padding: 8px 0; font-size: 18px; font-style: italic; color: {{t.soft}}; text-underline-offset: 5px; ">or skip for now</a></div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"tone":{"editor":"enum","options":["graphite","slate","umber","black"],"default":"graphite"},"phone":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { Science: true, Technology: true, History: true } }; }
  renderVals() {

    const dark = this.props.dark ?? false;
    const tone = this.props.tone ?? 'graphite';
    const phone = this.props.phone ?? false;
    const DARK = {
      black: { bg: '#121416', ink: '#E9EAE6', soft: '#C9CCC8', muted: '#A3A8AD', rule: '#3A3F44', accent: '#FF7A50', raised: '#1A1D20', sunk: '#24282C', correct: '#8DB4F0', correctWash: '#1A2638', incorrect: '#F0A35E', incorrectWash: '#2E2216' },
      graphite: { bg: '#1E2124', ink: '#E6E7E3', soft: '#C4C7C3', muted: '#A0A5AA', rule: '#3E444A', accent: '#FF7A50', raised: '#272B2F', sunk: '#31363B', correct: '#8DB4F0', correctWash: '#24324A', incorrect: '#F0A35E', incorrectWash: '#3A2C1E' },
      slate: { bg: '#1D2330', ink: '#E4E7EC', soft: '#C3C8D1', muted: '#9DA6B4', rule: '#3B4558', accent: '#FF8159', raised: '#262E3D', sunk: '#303A4C', correct: '#93B8F2', correctWash: '#26344D', incorrect: '#F2A866', incorrectWash: '#3B2E22' },
      umber: { bg: '#24221F', ink: '#ECE8E1', soft: '#CBC5BB', muted: '#A9A397', rule: '#46423B', accent: '#FF7E54', raised: '#2D2A26', sunk: '#38352F', correct: '#93B6EE', correctWash: '#2B3446', incorrect: '#F2A866', incorrectWash: '#3E3022' }
    };
    const t = dark ? (DARK[tone] || DARK.graphite)
      : { bg: '#F1F2EE', ink: '#16181A', soft: '#3B3F43', muted: '#565B60', rule: '#C9CCC6', accent: '#C23A12', raised: '#FFFFFF', sunk: '#E2E4DE', correct: '#1F4E8C', correctWash: '#E3EAF4', incorrect: '#8F3F00', incorrectWash: '#F6E7D8' };
    const Z = phone
      ? { minH: '844px', gutter: '24px', bottom: '0', headPad: '8px 0 10px', brand: '24px', leadTop: '56px', h1: '46px', h1Sm: '38px', h2: '28px', lead: '19px', body: '18px', gap: '88px', btnW: '100%', actDir: 'column', actAlign: 'stretch', actTop: '32px', rowTitle: '21px', big: '96px' }
      : { minH: '900px', gutter: '72px', bottom: '96px', headPad: '20px 0 16px', brand: '28px', leadTop: '112px', h1: '84px', h1Sm: '64px', h2: '36px', lead: '23px', body: '20px', gap: '152px', btnW: 'auto', actDir: 'row', actAlign: 'center', actTop: '40px', rowTitle: '25px', big: '160px' };
    const base = { t, dark, isLight: !dark, phone, desk: !phone, themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme' };

    const z = Object.assign({}, Z, phone ? { cols: 'repeat(2, minmax(0, 1fr))', tileH: '96px', tileName: '22px' } : { cols: 'repeat(4, minmax(0, 1fr))', tileH: '120px', tileName: '27px' });
    const N = ['Math', 'Science', 'Technology', 'History', 'Literature', 'Business', 'Finance', 'Arts', 'Language', 'Health and Wellness', 'Other'];
    const on = this.state.on, chosen = N.filter((n) => on[n]);
    const order = ['History', 'Technology', 'Science'];
    const nxt = chosen.length ? (order.find((n) => on[n]) || chosen[0]) : '';
    const status = chosen.length === 0 ? 'Pick at least one subject.' : (chosen.length === 1 ? '1 picked. ' : chosen.length + ' picked. ') + 'Tomorrow starts with ' + nxt + '.';
    const tiles = N.map((n) => ({ name: n, on: !!on[n], bg: on[n] ? t.raised : 'transparent', ink: on[n] ? t.ink : t.muted, mark: on[n] ? t.accent : t.muted, bar: on[n] ? t.accent : 'transparent', glyph: on[n] ? '✓ IN' : '+ ADD',
      go: () => this.setState({ on: Object.assign({}, on, { [n]: !on[n] }) }) }));
    return Object.assign(base, { z, tiles, status });
  }
}
</script>
</body>
</html>
