<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: {{z.minH}}; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Newsreader', Georgia, serif; box-sizing: border-box; padding: 0 {{z.gutter}} {{z.bottom}}; overflow: hidden; display: flex; flex-direction: column">
  <div style="width: 100%; max-width: 1200px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column">
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: {{z.headPad}}">
      <a href="#" style="flex: 1 1 0; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: {{t.ink}}; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>Leave lesson</a>
      <span style="font-size: {{z.brand}}; font-weight: 600; letter-spacing: -0.015em">TopicTutor</span>
      <div style="flex: 1 1 0; display: flex; justify-content: flex-end"><button type="button" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: {{t.ink}}"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if><sc-if value="{{dark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if></button></div>
    </header>
    <div style="width: 100%; max-width: {{z.col}}; margin: 8px auto 0">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><span style="height: 3px; background: {{t.ink}}"></span><span style="height: 3px; background: {{t.ink}}"></span><span style="height: 3px; background: {{t.accent}}"></span><span style="height: 3px; background: {{t.rule}}"></span></div>
      <p style="margin: 10px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.muted}}">Check · step 3 of 4</p>
    </div>
    <main style="width: 100%; max-width: {{z.col}}; margin: {{z.colTop}} auto 0">

      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.accent}}; ">Question 2 of 2</p>
      <h1 style="margin: 18px 0 0; font-size: {{z.qSize}}; line-height: 1.1; font-weight: 500; letter-spacing: -0.02em">Which of these years was a leap year?</h1>
      <div role="radiogroup" aria-label="Answers" style="display: grid; gap: 10px; margin-top: 40px">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
          <div role="radio" aria-checked="{{o.sel}}" style="display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 64px; padding: 0 20px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.ink}}">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{o.keyInk}}">{{o.k}}</span>
            <span style="font-size: 26px; font-weight: 500">{{o.y}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{o.tagInk}}">{{o.tag}}</span>
          </div>
        </sc-for>
      </div>
      <p style="margin: 28px 0 0; font-size: {{z.body}}; line-height: 1.55"><strong style="font-weight: 600; color: {{t.incorrect}}">Not quite.</strong> <span style="color: {{t.soft}}">1900 divides by 100 but not by 400, so it skipped its leap day. 2000 divides evenly by 400.</span></p>
      <div style="margin-top: 56px; padding-top: 28px; border-top: 1px solid {{t.ink}}">
        <p style="margin: 0; font-size: 18px; font-style: italic; color: {{t.muted}}">Right or wrong, answering finishes the lesson.</p>
        <div style="display: flex; flex-direction: {{z.actDir}}; align-items: {{z.actAlign}}; gap: 14px 28px; margin-top: {{z.actTop}}"><a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 14px; width: {{z.btnW}}; box-sizing: border-box; min-height: 58px; padding: 0 30px; background: {{t.ink}}; color: {{t.bg}}; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; text-decoration: none; ">Finish<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"tone":{"editor":"enum","options":["graphite","slate","umber","black"],"default":"graphite"},"phone":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {

    const dark = this.props.dark ?? false;
    const tone = this.props.tone ?? 'graphite';
    const phone = this.props.phone ?? false;
    const DARK = {
      black: { bg: '#121416', ink: '#E9EAE6', soft: '#C9CCC8', muted: '#A3A8AD', rule: '#3A3F44', accent: '#FF7A50', raised: '#1A1D20', sunk: '#24282C', correct: '#8DB4F0', correctWash: '#1A2638', incorrect: '#F0A35E', incorrectWash: '#2E2216' },
      graphite: { bg: '#1E2124', ink: '#E6E7E3', soft: '#C4C7C3', muted: '#A0A5AA', rule: '#3E444A', accent: '#FF7A50', raised: '#272B2F', sunk: '#31363B', correct: '#8DB4F0', correctWash: '#24324A', incorrect: '#F0A35E', incorrectWash: '#3A2C1E' },
      slate: { bg: '#1D2330', ink: '#E4E7EC', soft: '#C3C8D1', muted: '#9DA6B4', rule: '#3B4558', accent: '#FF8159', raised: '#262E3D', sunk: '#303A4C', correct: '#93B8F2', correctWash: '#26344D', incorrect: '#F2A866', incorrectWash: '#3B2E22' },
      umber: { bg: '#24221F', ink: '#ECE8E1', soft: '#CBC5BB', muted: '#A9A397', rule: '#46423B', accent: '#FF7E54', raised: '#2D2A26', sunk: '#38352F', correct: '#93B6EE', correctWash: '#2B3446', incorrect: '#F2A866', incorrectWash: '#3E3022' }
    };
    const t = dark ? (DARK[tone] || DARK.graphite)
      : { bg: '#F1F2EE', ink: '#16181A', soft: '#3B3F43', muted: '#565B60', rule: '#C9CCC6', accent: '#C23A12', raised: '#FFFFFF', sunk: '#E2E4DE', correct: '#1F4E8C', correctWash: '#E3EAF4', incorrect: '#8F3F00', incorrectWash: '#F6E7D8' };
    const Z = phone
      ? { minH: '844px', gutter: '24px', bottom: '0', headPad: '8px 0 10px', brand: '24px', leadTop: '56px', h1: '46px', h1Sm: '38px', h2: '28px', lead: '19px', body: '18px', gap: '88px', btnW: '100%', actDir: 'column', actAlign: 'stretch', actTop: '32px', rowTitle: '21px', big: '96px' }
      : { minH: '960px', gutter: '72px', bottom: '96px', headPad: '20px 0 16px', brand: '28px', leadTop: '112px', h1: '84px', h1Sm: '64px', h2: '36px', lead: '23px', body: '20px', gap: '152px', btnW: 'auto', actDir: 'row', actAlign: 'center', actTop: '40px', rowTitle: '25px', big: '160px' };
    const base = { t, dark, isLight: !dark, phone, desk: !phone, themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme' };

    const z = Object.assign({}, Z, phone ? { col: '100%', colTop: '48px', qSize: '30px' } : { col: '720px', colTop: '88px', qSize: '48px' });

    const O = [['A', '1700', ''], ['B', '1800', ''], ['C', '1900', '✕ Your answer'], ['D', '2000', '✓ Correct']];
    const opts = O.map((o) => {
      const wrong = o[1] === '1900', right = o[1] === '2000';
      return { k: o[0], y: o[1], tag: o[2], sel: wrong,
        border: wrong ? t.incorrect : (right ? t.correct : t.rule), bg: wrong ? t.incorrectWash : (right ? t.correctWash : 'transparent'),
        ink: wrong || right ? t.ink : t.muted, keyInk: t.muted, tagInk: wrong ? t.incorrect : t.correct };
    });
    return Object.assign(base, { z, opts });
  }
}
</script>
</body>
</html>
