<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: {{z.minH}}; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Newsreader', Georgia, serif; box-sizing: border-box; padding: 0 {{z.gutter}} {{z.bottom}}; overflow: hidden; display: flex; flex-direction: column">
  <div style="width: 100%; max-width: 1200px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column">
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: {{z.headPad}}">
      <a href="#" style="flex: 1 1 0; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: {{t.ink}}; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>Close</a>
      <span style="font-size: {{z.brand}}; font-weight: 600; letter-spacing: -0.015em">TopicTutor</span>
      <div style="flex: 1 1 0; display: flex; justify-content: flex-end"><button type="button" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: {{t.ink}}"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if><sc-if value="{{dark}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if></button></div>
    </header>
    <div style="width: 100%; max-width: {{z.col}}; margin: 8px auto 0">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px"><span style="height: 3px; background: {{t.ink}}"></span><span style="height: 3px; background: {{t.ink}}"></span><span style="height: 3px; background: {{t.ink}}"></span><span style="height: 3px; background: {{t.accent}}"></span></div>
      <p style="margin: 10px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.muted}}">Finish · step 4 of 4</p>
    </div>

    <main style="width: 100%; max-width: 960px; margin: {{z.colTop}} auto 0">
      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.accent}}; ">Lesson finished · Science</p>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 40px; margin-top: 20px">
        <p style="margin: 0; font-size: {{z.big}}; line-height: 0.8; font-weight: 500; letter-spacing: -0.05em; color: {{t.accent}}">13</p>
        <div role="img" aria-label="Six days before today done, today done" style="display: grid; grid-template-columns: repeat(7, 28px); gap: 4px; margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-align: center; color: {{t.muted}}">
          <sc-for list="{{week}}" as="d" hint-placeholder-count="7"><div><div style="width: 12px; height: 12px; margin: 0 auto 5px; border-radius: 999px; background: {{d.fill}}"></div>{{d.l}}</div></sc-for>
        </div>
      </div>
      <h1 style="margin: 32px 0 0; font-size: {{z.h1Sm}}; line-height: 1; font-weight: 500; letter-spacing: -0.025em">Thirteen days in a row!</h1>
      <p style="margin: 20px 0 0; max-width: 560px; font-size: {{z.lead}}; line-height: 1.45; color: {{t.soft}}">You got 1 of 2 on the check. Up next in your series is lesson 3, on which CSS rule wins.</p>
      <div style="display: flex; flex-direction: {{z.actDir}}; align-items: {{z.actAlign}}; gap: 14px 28px; margin-top: {{z.actTop}}"><a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 14px; width: {{z.btnW}}; box-sizing: border-box; min-height: 58px; padding: 0 30px; background: {{t.ink}}; color: {{t.bg}}; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; text-decoration: none; ">Continue your series<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a><a href="#" style="display: inline-block; padding: 8px 0; font-size: 18px; font-style: italic; color: {{t.soft}}; text-underline-offset: 5px; ">or go deeper on calendars</a><a href="#" style="display: inline-block; padding: 8px 0; font-size: 18px; font-style: italic; color: {{t.soft}}; text-underline-offset: 5px; ">or stop for today</a></div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"tone":{"editor":"enum","options":["graphite","slate","umber","black"],"default":"graphite"},"phone":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {

    const dark = this.props.dark ?? false;
    const tone = this.props.tone ?? 'graphite';
    const phone = this.props.phone ?? false;
    const DARK = {
      black: { bg: '#121416', ink: '#E9EAE6', soft: '#C9CCC8', muted: '#A3A8AD', rule: '#3A3F44', accent: '#FF7A50', raised: '#1A1D20', sunk: '#24282C', correct: '#8DB4F0', correctWash: '#1A2638', incorrect: '#F0A35E', incorrectWash: '#2E2216' },
      graphite: { bg: '#1E2124', ink: '#E6E7E3', soft: '#C4C7C3', muted: '#A0A5AA', rule: '#3E444A', accent: '#FF7A50', raised: '#272B2F', sunk: '#31363B', correct: '#8DB4F0', correctWash: '#24324A', incorrect: '#F0A35E', incorrectWash: '#3A2C1E' },
      slate: { bg: '#1D2330', ink: '#E4E7EC', soft: '#C3C8D1', muted: '#9DA6B4', rule: '#3B4558', accent: '#FF8159', raised: '#262E3D', sunk: '#303A4C', correct: '#93B8F2', correctWash: '#26344D', incorrect: '#F2A866', incorrectWash: '#3B2E22' },
      umber: { bg: '#24221F', ink: '#ECE8E1', soft: '#CBC5BB', muted: '#A9A397', rule: '#46423B', accent: '#FF7E54', raised: '#2D2A26', sunk: '#38352F', correct: '#93B6EE', correctWash: '#2B3446', incorrect: '#F2A866', incorrectWash: '#3E3022' }
    };
    const t = dark ? (DARK[tone] || DARK.graphite)
      : { bg: '#F1F2EE', ink: '#16181A', soft: '#3B3F43', muted: '#565B60', rule: '#C9CCC6', accent: '#C23A12', raised: '#FFFFFF', sunk: '#E2E4DE', correct: '#1F4E8C', correctWash: '#E3EAF4', incorrect: '#8F3F00', incorrectWash: '#F6E7D8' };
    const Z = phone
      ? { minH: '844px', gutter: '24px', bottom: '0', headPad: '8px 0 10px', brand: '24px', leadTop: '56px', h1: '46px', h1Sm: '38px', h2: '28px', lead: '19px', body: '18px', gap: '88px', btnW: '100%', actDir: 'column', actAlign: 'stretch', actTop: '32px', rowTitle: '21px', big: '96px' }
      : { minH: '900px', gutter: '72px', bottom: '96px', headPad: '20px 0 16px', brand: '28px', leadTop: '112px', h1: '84px', h1Sm: '64px', h2: '36px', lead: '23px', body: '20px', gap: '152px', btnW: 'auto', actDir: 'row', actAlign: 'center', actTop: '40px', rowTitle: '25px', big: '160px' };
    const base = { t, dark, isLight: !dark, phone, desk: !phone, themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme' };

    const z = Object.assign({}, Z, phone ? { col: '100%', colTop: '48px', qSize: '30px' } : { col: '720px', colTop: '88px', qSize: '48px' });

    const week = 'WTFSSMT'.split('').map((l, i) => ({ l, fill: i === 6 ? t.accent : t.ink }));
    return Object.assign(base, { z, week });
  }
}
</script>
</body>
</html>
