<!-- @dsCard group="Navigation" height=380 subtitle="Signed out, guest with progress, signed in with menu open" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-serif); }
  .wrap { display: flex; flex-direction: column; gap: 22px; padding: 16px 24px 24px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding-bottom: 12px; border-bottom: 3px double var(--ink); }
  .brand { font-size: 26px; font-weight: 600; letter-spacing: -0.015em; color: var(--ink); text-decoration: none; }
  nav { display: flex; align-items: center; gap: 2px; font-family: var(--font-mono); font-size: 14px; }
  nav a { padding: 12px 12px; color: var(--ink); text-decoration: none; }
  nav a[aria-current] { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .outline { border: 1.5px solid var(--ink); padding: 10px 14px !important; }
  .icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--ink); }
  .guest { font-family: var(--font-serif); font-style: italic; font-size: 15px; color: var(--ink-muted); }
  .avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 17px; font-weight: 500; }
  .acct { position: relative; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px 0 8px; background: transparent; border: none; color: var(--ink); }
  .menu { position: absolute; right: 0; top: 52px; width: 240px; background: var(--paper-raised); border: 1.5px solid var(--ink); z-index: 2; }
  .menu p { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--rule); font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu small { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }
  .menu a { display: block; padding: 12px 16px; font-family: var(--font-mono); font-size: 14px; color: var(--ink); text-decoration: none; }
  .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div><p class="tag">Signed out</p>
  <header><a class="brand" href="#">TopicTutor</a><nav><a href="#">Log in</a><a class="outline" href="#">Register</a><button class="icon" aria-label="Switch to dark theme"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></nav></header></div>

  <div><p class="tag">Guest with progress</p>
  <header><a class="brand" href="#">TopicTutor</a><nav><span class="guest">Your 1-day streak lives in this browser.</span><a class="outline" href="#">Keep it · create account</a><button class="icon" aria-label="Switch to dark theme"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></nav></header></div>

  <div style="padding-bottom: 150px"><p class="tag">Signed in, account menu open</p>
  <header><a class="brand" href="#">TopicTutor</a><nav><a href="#" aria-current="page">Today</a><a href="#">Library</a><a href="#">Stats</a><button class="icon" aria-label="Switch to dark theme"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <div style="position: relative"><button class="acct" aria-expanded="true" aria-haspopup="menu" aria-label="Account: Duane"><span class="avatar" aria-hidden="true">D</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu" role="menu"><p>Duane Cabahug<small>duane@example.com</small></p><a role="menuitem" href="#">Profile</a><a role="menuitem" href="#">Sign out</a></div></div>
  </nav></header></div>
</div>
</body>
</html>
