<!-- @dsCard group="Navigation" height=200 subtitle="Four steps, with and without recall" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); }
  .wrap { display: flex; flex-direction: column; gap: 28px; padding: 24px; max-width: 520px; }
  nav { border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); padding-top: 3px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  li { display: flex; align-items: center; gap: 5px; padding: 11px 0 10px; color: var(--ink-muted); }
  li[aria-current] { color: var(--ink); font-weight: 500; padding-bottom: 7px; border-bottom: 3px solid var(--accent); }
  .skip { text-decoration: line-through; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  p { margin: 0 0 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p>Returning learner, on the lesson</p>
    <nav aria-label="Session progress"><ol>
      <li><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Recall<span class="sr">, done</span></li>
      <li aria-current="step">2 Lesson</li>
      <li>3 Check</li>
      <li>4 Finish</li>
    </ol></nav>
  </div>
  <div>
    <p>First visit, no history to recall</p>
    <nav aria-label="Session progress"><ol style="grid-template-columns: repeat(3, minmax(0, 1fr))">
      <li aria-current="step">1 Lesson</li>
      <li>2 Check</li>
      <li>3 Finish</li>
    </ol></nav>
  </div>
</div>
</body>
</html>
